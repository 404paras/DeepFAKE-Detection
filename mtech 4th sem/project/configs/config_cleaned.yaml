# Configuration using cleaned manifests (without corrupted videos)
# Copy of config.yaml with updated manifest paths

data:
  dataset_path: "dataset/extracted/train"
  manifests_path: "data/manifests_cleaned"  # Using cleaned manifests
  preprocessed_path: "data/preprocessed"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  seed: 42
  num_workers: 4

preprocessing:
  video:
    num_frames: 16
    img_size: 224
    normalize: true
    mean: [0.485, 0.456, 0.406]  # ImageNet stats
    std: [0.229, 0.224, 0.225]

    augmentation:
      enabled: true
      horizontal_flip: 0.5
      rotation: 10  # degrees
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.1
      gaussian_blur:
        kernel_size: [3, 7]
        sigma: [0.1, 2.0]
      random_erasing:
        p: 0.5
        scale: [0.02, 0.33]
        ratio: [0.3, 3.3]

  audio:
    sample_rate: 16000
    duration: 3.0  # seconds
    n_samples: 48000  # duration * sample_rate
    n_fft: 2048
    hop_length: 512
    n_mels: 128
    f_min: 0
    f_max: 8000

    augmentation:
      enabled: true
      time_stretch:
        min_rate: 0.8
        max_rate: 1.2
        p: 0.5
      pitch_shift:
        min_steps: -2
        max_steps: 2
        p: 0.5
      add_gaussian_noise:
        min_snr: 20
        max_snr: 40
        p: 0.5
      spec_augment:
        freq_mask_param: 15
        time_mask_param: 20
        num_freq_masks: 2
        num_time_masks: 2
        p: 0.5

model:
  video_encoder:
    backbone: "resnet50"
    pretrained: true
    freeze_layers: [1, 2, 3]  # Freeze first 3 layers
    bigru_hidden: 512
    bigru_layers: 2
    bidirectional: true
    dropout: 0.0
    output_dim: 2048

  audio_encoder:
    conv_channels: [64, 128, 256, 512]
    kernel_size: 3
    padding: 1
    pool_size: 2
    bigru_hidden: 256
    bigru_layers: 2
    bidirectional: true
    dropout: 0.0
    output_dim: 512

  cross_modal_attention:
    num_heads: 8
    dropout: 0.1
    embed_dim: 2560  # video_dim + audio_dim

  classifier:
    hidden_dims: [1536, 768, 256]
    dropout: 0.3
    num_classes: 4
    activation: "relu"

training:
  batch_size: 32
  num_epochs: 50
  accumulation_steps: 1  # For gradient accumulation if needed

  optimizer:
    name: "AdamW"
    lr: 0.0001
    weight_decay: 0.00001
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    name: "ReduceLROnPlateau"
    mode: "max"
    factor: 0.5
    patience: 5
    min_lr: 0.000001

  loss:
    name: "CrossEntropyLoss"
    label_smoothing: 0.0

  gradient_clip: 1.0
  mixed_precision: true

  early_stopping:
    enabled: true
    patience: 10
    metric: "val_auc_roc"
    mode: "max"
    min_delta: 0.001

  checkpoint:
    save_dir: "checkpoints"
    save_best: true
    save_last: true
    save_every_n_epochs: 5
    metric: "val_auc_roc"
    mode: "max"

  logging:
    log_dir: "logs"
    log_every_n_steps: 100
    use_tensorboard: true
    use_wandb: false
    wandb_project: "multimodal-deepfake-detection"
    wandb_entity: null

evaluation:
  batch_size: 64

  metrics:
    - accuracy
    - auc_roc
    - f1_macro
    - f1_weighted
    - precision_macro
    - precision_weighted
    - recall_macro
    - recall_weighted
    - confusion_matrix

  visualizations:
    save_dir: "results"
    types:
      - roc_curves
      - confusion_matrix
      - attention_maps
      - per_class_metrics
      - prediction_distribution

  robustness:
    compression_qualities: [50, 70, 90]
    resolutions: [144, 240, 360]
    noise_levels: [0.01, 0.05, 0.1]

inference:
  batch_size: 1
  device: "cuda"
  checkpoint_path: "checkpoints/best_model.pth"

# Class labels
classes:
  - "Real-Real"      # 0: Both video and audio are real
  - "Real-Fake"      # 1: Real video, fake audio
  - "Fake-Real"      # 2: Fake video, real audio
  - "Fake-Fake"      # 3: Both video and audio are fake
